[project]
name = "oznayu"
version = "0.1.0"
description = "О!знаю — проверяемые факты об отелях и номерах и поиск по свободному тексту"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Приложение у жюри: API, база, миграции, загрузка пакетов городов.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "pydantic-settings>=2.6",
    "opening-hours-py==2.1.4",
]
# Сборка пакетов городов (вне запуска жюри). Версии — как в расчётах v9 (requirements-v9.lock.txt).
builder = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "rasterio==1.5.2",
    "osmium==4.3.2",
    "pvlib==0.16.1",
    "astral==3.2",
    "h5py==3.16.0",
    "requests==2.34.2",
]
# LLM-шлюз (D21): Anthropic — основной, OpenAI-совместимый — запасной.
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
# Это приложение, а не библиотека: пакеты app/, core/, agents/ и т. д. импортируются из корня репозитория.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["research_notes", "reports", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
